# Carga para GET /api/perf/echo (aiquaa Sandbox API, namespace perf).
# Rate limit declarado: 3000 req/min por ruta -> objetivo 2400 req/min (80%)
# para medir latencia sin que el 429 contamine los resultados.
# apiKey NO va aquí: pasar -JapiKey=... (secret AIQUAA_API_KEY en CI).
protocol=https
host=aiquaa-sandbox-api.vercel.app
port=443
threads=20
rampUp=30
duration=300
loops=-1
targetPerMin=2400
delayMs=0
bytes=0
errorRate=0
