name: JMeter AIQUAAECHO
on:
  workflow_dispatch:
    inputs:
      threads:
        description: Usuarios concurrentes (closed workload)
        required: false
        default: '20'
      duration:
        description: Duración en segundos
        required: false
        default: '300'
      target_per_min:
        description: Throughput objetivo total en req/min (rate limit de la ruta = 3000)
        required: false
        default: '2400'
      delay_ms:
        description: Latencia artificial del echo (delayMs, 0-5000)
        required: false
        default: '0'
      monitoring_dashboard_url:
        description: >-
          URL pública de dashboard de monitoreo (Grafana, etc.) a capturar como evidencia
          post-ejecución; dejar vacío para omitir la captura.
        required: false
        default: ''
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JMeter
        run: |
          curl --fail --location --silent --show-error https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz -o jmeter.tgz
          tar -xzf jmeter.tgz
      - name: Run headless
        # The sandbox rejects requests without x-api-key, so the key comes from
        # the AIQUAA_API_KEY secret and is passed as a JMeter property; it is
        # never written to the plan or the properties file.
        # The plan's Simple Data Writer defaults to the same path as -l; two
        # writers with different columns on one file leave a headerless JTL
        # that neither the HTML dashboard nor the report can read, so its
        # output is redirected and -l stays the single canonical JTL.
        env:
          AIQUAA_API_KEY: ${{ secrets.AIQUAA_API_KEY }}
        run: |
          if [ -z "$AIQUAA_API_KEY" ]; then echo "::error::Falta el secret AIQUAA_API_KEY"; exit 1; fi
          mkdir -p test-results/performance/dashboard
          apache-jmeter-5.6.3/bin/jmeter -n -t tests/performance/plans/P_AIQUAAECHO.jmx \
            -q tests/performance/properties/sandbox.properties \
            -JapiKey="$AIQUAA_API_KEY" \
            -Jthreads="${{ inputs.threads }}" -Jduration="${{ inputs.duration }}" \
            -JtargetPerMin="${{ inputs.target_per_min }}" -JdelayMs="${{ inputs.delay_ms }}" \
            -JjtlFile=test-results/performance/plan-writer.jtl \
            -l test-results/performance/R_AIQUAAECHO.jtl -e -o test-results/performance/dashboard
      - name: Set up Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            src/reporting/python/requirements.txt
            src/monitoring/python/requirements.txt
      - name: Install report dependencies
        if: always()
        run: pip install -r src/reporting/python/requirements.txt
      - name: Install monitoring capture dependencies
        if: ${{ always() && inputs.monitoring_dashboard_url != '' }}
        run: pip install -r src/monitoring/python/requirements.txt
      - name: Capture monitoring dashboard evidence
        # Chrome ships preinstalled on GitHub-hosted ubuntu-latest runners, so
        # Selenium Manager resolves a matching driver on its own. A failed
        # capture must not block the report, hence continue-on-error.
        if: ${{ always() && inputs.monitoring_dashboard_url != '' }}
        continue-on-error: true
        run: |
          mkdir -p test-results/performance/evidence
          python3 src/monitoring/python/capture_dashboard.py \
            --url "${{ inputs.monitoring_dashboard_url }}" \
            --output test-results/performance/evidence/EVIDENCIA_MONITOREO.png \
            --wait-seconds 8 \
            --ready-timeout-seconds 180
      - name: Generate PDF report and evaluate thresholds
        # Writes the PDF first and only then exits 1 when thresholds fail, so
        # the report is uploaded either way and the job still goes red.
        if: always()
        run: |
          EVIDENCE_ARGS=()
          if [ -f test-results/performance/evidence/EVIDENCIA_MONITOREO.png ]; then
            EVIDENCE_ARGS=(--evidence-image test-results/performance/evidence/EVIDENCIA_MONITOREO.png \
              --evidence-label "Dashboard de monitoreo" \
              --evidence-url "${{ inputs.monitoring_dashboard_url }}")
          fi
          python3 src/reporting/python/generate_report.py \
            --jtl test-results/performance/R_AIQUAAECHO.jtl \
            --thresholds tests/performance/thresholds/thresholds_AIQUAAECHO.json \
            --output test-results/performance/INFORME_PERF_AIQUAAECHO.pdf \
            --summary-json test-results/performance/summary.json \
            --api-name "aiquaa Sandbox API — GET /api/perf/echo" --test-type load \
            --threads "${{ inputs.threads }}" --target-per-min "${{ inputs.target_per_min }}" \
            --plan tests/performance/plans/P_AIQUAAECHO.jmx \
            --repo-url https://aiquaa-sandbox-api.vercel.app/docs/perf "${EVIDENCE_ARGS[@]}"
      - name: Upload PDF report (opens in the browser)
        # archive: false uploads the PDF as-is instead of zipped, so it can be
        # opened straight from the run page without downloading a zip.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/performance/INFORME_PERF_AIQUAAECHO.pdf
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jmeter-AIQUAAECHO
          path: test-results/performance
